<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Why Anime</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Outfit',sans-serif;
background:#0b0b0b;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
text-align:center;
}

.container{
max-width:800px;
padding:50px;
border-radius:20px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(12px);
}

h1{
font-size:3rem;
margin-bottom:20px;
}

h1 span{
color:#ce0000;
}

p{
font-size:1.1rem;
line-height:1.9;
color:#cfcfcf;
}

.button{
margin-top:30px;
display:inline-block;
padding:14px 26px;
border:1px solid #ce0000;
border-radius:12px;
text-decoration:none;
color:white;
transition:0.3s;
}

.button:hover{
background:#ce0000;
transform:scale(1.05);
}

</style>

</head>

<body>

<div class="container">

<h1>Why <span>Anime?</span></h1>

<p>
Anime is more than entertainment.  
It shows real emotions, struggles, and growth in a powerful way.  
It teaches that failure is not the end, and every person has the power to rise again and become stronger.
</p>

<a class="button" href="index.html">Back to Home</a>

</div>

</body>

</html>
